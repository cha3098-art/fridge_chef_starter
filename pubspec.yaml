name: fridge_chef
description: 냉장고 재료 기반 레시피 추천 앱
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  image_picker: ^1.2.3
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4
  app_links: ^6.0.1
  shared_preferences: ^2.2.3
  google_mlkit_text_recognition: ^0.13.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_1024.png"
  adaptive_icon_background: "#FAFBFC"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon_square.png
    - assets/icon/icon_share.png
    - assets/icon/icon_challenge.png
    - assets/icon/icon_recipe.png
    - assets/icon/icon_kfood_hanbok.png
    - assets/icon/icon_kfood_cooking.png
    - assets/icon/icon_challenge_rival.png
    - assets/icon/icon_board.png
    - assets/icon/icon_my.png
    - assets/icon/icon_ranking.png
    - assets/icon/menu_receipt.png
    - assets/icon/menu_additem.png
    - assets/icon/menu_airecipe.png
    - assets/icon/menu_invite.png
    - assets/icon/menu_kfood.png
    - assets/icon/menu_expiring.png
    - assets/icon/menu_battle.png
    - assets/icon/menu_board.png
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 400
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 500
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 600
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 700
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 800
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 900
